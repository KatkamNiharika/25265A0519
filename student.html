<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        background: #fff;
        width: 700px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
      }

      input[type="radio"],
      input[type="checkbox"] {
        width: auto;
      }

      .gender {
        display: flex;
        gap: 20px;
        margin-top: 5px;
      }

      .buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      button {
        width: 48%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        font-size: 17px;
        cursor: pointer;
      }

      .register {
        background: #28a745;
        color: white;
      }

      .register:hover {
        background: #218838;
      }

      .reset {
        background: #dc3545;
        color: white;
      }

      .reset:hover {
        background: #c82333;
      }

      .error {
        color: red;
        font-size: 14px;
        margin-top: 5px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Student Registration Form</h2>

      <form id="registrationForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" required />
        </div>

        <div class="form-group">
          <label>Roll Number</label>
          <input type="text" id="roll" required />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" maxlength="10" required />
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="dob" required />
        </div>

        <div class="form-group">
          <label>Gender</label>

          <div class="gender">
            <label
              ><input type="radio" name="gender" value="Male" required />
              Male</label
            >
            <label
              ><input type="radio" name="gender" value="Female" /> Female</label
            >
            <label
              ><input type="radio" name="gender" value="Other" /> Other</label
            >
          </div>
        </div>

        <div class="form-group">
          <label>Department</label>

          <select id="department" required>
            <option value="">Select Department</option>
            <option>CSE</option>
            <option>CSE-AI</option>
            <option>IT</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>Mechanical</option>
            <option>Civil</option>
          </select>
        </div>

        <div class="form-group">
          <label>Year</label>

          <select id="year" required>
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
          </select>
        </div>

        <div class="form-group">
          <label>Section</label>
          <input type="text" id="section" required />
        </div>

        <div class="form-group">
          <label>Event Name</label>

          <select id="event" required>
            <option value="">Select Event</option>
            <option>Hackathon</option>
            <option>Coding Contest</option>
            <option>Paper Presentation</option>
            <option>Quiz Competition</option>
            <option>Workshop</option>
            <option>Poster Presentation</option>
          </select>
        </div>

        <div class="form-group">
          <label>Address</label>

          <textarea rows="3"></textarea>
        </div>

        <div class="form-group">
          <label>Upload Student ID</label>

          <input type="file" required />
        </div>

        <div class="form-group">
          <label>Password</label>

          <input type="password" id="password" required />
        </div>

        <div class="form-group">
          <label>Confirm Password</label>

          <input type="password" id="confirmPassword" required />
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" required />

            I agree to the Terms and Conditions
          </label>
        </div>

        <div class="buttons">
          <button class="register" type="submit">Register</button>

          <button class="reset" type="reset">Reset</button>
        </div>
      </form>
    </div>

    <script>
      document
        .getElementById("registrationForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          let phone = document.getElementById("phone").value;

          let password = document.getElementById("password").value;

          let confirmPassword =
            document.getElementById("confirmPassword").value;

          if (phone.length != 10 || isNaN(phone)) {
            alert("Enter a valid 10-digit phone number.");
            return;
          }

          if (password.length < 6) {
            alert("Password must be at least 6 characters.");
            return;
          }

          if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
          }

          alert("Student Registered Successfully!");

          this.reset();
        });
    </script>
  </body>
</html>
